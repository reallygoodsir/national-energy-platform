<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roles</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            background: #0f172a;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 40px;
        }

        h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #111827;
            border-radius: 6px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #1f2937;
        }

        th {
            background: #0b1220;
            color: #cbd5e1;
            font-weight: 600;
        }

        td {
            color: #e5e7eb;
        }

        tr:hover {
            background: #1f2937;
        }

        .error {
            color: #f87171;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>All Roles</h2>

    <div id="errorBox" class="error"></div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
        </tr>
        </thead>

        <tbody id="rolesTable"></tbody>
    </table>

</div>

<script>

    async function loadRoles() {

        const res = await fetch("/api/roles");

        if (!res.ok) {
            document.getElementById("errorBox").innerText = "Failed to load roles";
            return;
        }

        const data = await res.json();

        const table = document.getElementById("rolesTable");
        table.innerHTML = "";

        data.forEach(role => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${role.id}</td>
                <td>${role.name}</td>
                <td>${role.description || ""}</td>
            `;

            table.appendChild(row);
        });
    }

    loadRoles();

</script>

</body>
</html>
