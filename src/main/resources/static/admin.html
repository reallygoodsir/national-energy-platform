<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Maintenance</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            background: #0f172a;
            color: white;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        .side-menu {
            width: 180px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0b1220;
            border-right: 1px solid #1f2937;
        }

        .menu-item {
            cursor: pointer;
            color: #cbd5e1;
            font-size: 14px;
            padding: 8px 10px;
            border-radius: 4px;
        }

        .menu-item:hover {
            background: #1f2937;
            color: white;
        }

        .menu-item.logout {
            color: #f87171;
        }

        .menu-item.logout:hover {
            background: #3b1f1f;
        }

        .content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        input, select {
            margin: 8px 0;
            padding: 10px;
            border: none;
            border-radius: 4px;
            width: 100%;
            max-width: 340px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #3b82f6;
            color: white;
        }

        .box {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #1f2937;
            border-radius: 6px;
            background: #0b1220;
            max-width: 500px;
        }

        .hidden { display: none; }

        .section-title {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #cbd5e1;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="side-menu">
        <div class="menu-item logout" onclick="logout()">Logout</div>
        <div class="menu-item" onclick="showRoles()">User Roles</div>
        <div class="menu-item" onclick="showMeters()">Electric Meters</div>
    </div>

    <div class="content">

        <div id="homeState">
            <h2>Welcome</h2>
            <p>Select a menu option.</p>
        </div>

        <div id="rolesPanel" class="hidden">
            <h2>User Search</h2>

            <input type="text" id="searchInput" placeholder="Enter email or phone">

            <button onclick="searchUser()">Search User</button>

            <div id="errorBox"></div>

            <div id="userBox" class="box hidden">
                <h3 id="userName"></h3>

                <div class="section-title">Assigned Roles</div>
                <div id="assignedRoles"></div>

                <div class="section-title">Assign New Role</div>

                <select id="roleSelect"></select>

                <button onclick="assignRole()">Assign Role</button>

                <div id="assignMessage"></div>
            </div>
        </div>

        <div id="metersPanel" class="hidden">
            <h2>Create Electric Meter</h2>

            <div class="box">

                <div class="section-title">Serial Number</div>
                <input id="meterSerial" type="text">

                <div class="section-title">Phase Count</div>
                <input id="meterPhase" type="number">

                <div class="section-title">Type</div>
                <select id="meterType"></select>

                <button onclick="createMeter()">Create Meter</button>

                <div id="meterMessage"></div>
            </div>
        </div>

    </div>
</div>

<script>

    let currentUserId = null;

    function showRoles() {
        document.getElementById("homeState").classList.add("hidden");
        document.getElementById("metersPanel").classList.add("hidden");
        document.getElementById("rolesPanel").classList.remove("hidden");
    }

    function showMeters() {
        document.getElementById("homeState").classList.add("hidden");
        document.getElementById("rolesPanel").classList.add("hidden");
        document.getElementById("metersPanel").classList.remove("hidden");
        loadMeterTypes();
    }

    async function loadMeterTypes() {
        const res = await fetch("/national-energy-platform/api/electric-meters/types");

        if (!res.ok) {
            document.getElementById("meterMessage").innerText =
                "Failed to load meter types";
            return;
        }

        const data = await res.json();

        const select = document.getElementById("meterType");
        select.innerHTML = "";

        data.forEach(t => {
            const opt = document.createElement("option");
            opt.value = t.id;        // ✅ IMPORTANT: ID SENT
            opt.text = t.name;
            select.appendChild(opt);
        });
    }

    async function createMeter() {

        const serialNumber = document.getElementById("meterSerial").value;
        const phaseCount = document.getElementById("meterPhase").value;
        const typeId = document.getElementById("meterType").value;

        const res = await fetch("/national-energy-platform/api/electric-meters", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                serialNumber,
                phaseCount: Number(phaseCount),
                typeId: Number(typeId)   // ✅ FIXED: ID not name
            })
        });

        const msg = document.getElementById("meterMessage");

        if (res.ok) {
            msg.innerText = "Meter created successfully";
        } else {
            const err = await res.text();
            msg.innerText = err || "Failed to create meter";
        }
    }

    async function logout() {
        await fetch("/national-energy-platform/api/auth/logout", {
            method: "POST",
            credentials: "include"
        });

        window.location.href = "/national-energy-platform/index.html";
    }

</script>

</body>
</html>
