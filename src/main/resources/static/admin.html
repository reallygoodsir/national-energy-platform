<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Maintenance</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            background: #0f172a;
            color: white;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        .side-menu {
            width: 180px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0b1220;
            border-right: 1px solid #1f2937;
        }

        .menu-item {
            cursor: pointer;
            color: #cbd5e1;
            font-size: 14px;
            padding: 8px 10px;
            border-radius: 4px;
        }

        .menu-item:hover {
            background: #1f2937;
            color: white;
        }

        .menu-item.logout {
            color: #f87171;
        }

        .menu-item.logout:hover {
            background: #3b1f1f;
        }

        .content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        input, select {
            margin: 8px 0;
            padding: 10px;
            border: none;
            border-radius: 4px;
            width: 100%;
            max-width: 340px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #3b82f6;
            color: white;
            display: block;
            margin-top: 14px;
        }

        .box {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #1f2937;
            border-radius: 6px;
            background: #0b1220;
            max-width: 500px;
        }

        .hidden { display: none; }

        .section-title {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #cbd5e1;
            font-size: 14px;
        }

        #meterMessage {
            margin-top: 14px;
        }

        .error {
            color: #f87171;
            margin-top: 10px;
            white-space: pre-line;
        }

        .role {
            display: inline-block;
            padding: 6px 10px;
            margin: 4px;
            background: #1f2937;
            border-radius: 6px;
            font-size: 13px;
        }

        .remove-role {
            margin-left: 8px;
            color: #f87171;
            cursor: pointer;
            font-weight: bold;
        }

        .muted {
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="side-menu">
        <div class="menu-item logout" onclick="logout()">Logout</div>
        <div class="menu-item" onclick="showRoles()">User Roles</div>
        <div class="menu-item" onclick="showMeters()">Electric Meters</div>
        <div class="menu-item" onclick="showLocations()">User Location</div>
    </div>

    <div class="content">

        <div id="homeState">
            <h2>Welcome</h2>
            <p>Select a menu option.</p>
        </div>

        <!-- ROLES -->
        <div id="rolesPanel" class="hidden">
            <h2>User Search</h2>

            <input type="text" id="searchInput" placeholder="Enter email or phone">
            <button onclick="searchUser()">Search User</button>

            <div id="errorBox" class="error"></div>

            <div id="userBox" class="box hidden">
                <h3 id="userName"></h3>

                <div class="section-title">Assigned Roles</div>
                <div id="assignedRoles"></div>

                <div class="section-title">Assign New Role</div>
                <select id="roleSelect"></select>

                <div id="noRolesMsg" class="muted hidden">No available roles</div>

                <button onclick="assignRole()">Assign Role</button>
                <div id="assignMessage"></div>
            </div>
        </div>

        <!-- METERS -->
        <div id="metersPanel" class="hidden">
            <h2>Create Electric Meter</h2>

            <div class="box">

                <div class="section-title">Serial Number</div>
                <input id="meterSerial" type="text">

                <div class="section-title">Phase Count</div>
                <select id="meterPhase">
                    <option value="" selected disabled>-- Select Phase Count --</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>

                <div class="section-title">Type</div>
                <select id="meterType"></select>

                <button onclick="createMeter()">Create Meter</button>
                <div id="meterMessage"></div>
            </div>
        </div>

        <!-- LOCATION -->
        <div id="locationsPanel" class="hidden">
            <h2>User Location</h2>

            <div class="box">

                <div class="section-title">Select User</div>
                <input id="locUserSearch" type="text" placeholder="email or phone">
                <button onclick="selectUserForLocation()">Find User</button>

                <div id="selectedUserInfo" class="muted"></div>

                <div class="section-title">City</div>
                <input id="locCity" type="text">

                <div class="section-title">Street</div>
                <input id="locStreet" type="text">

                <div class="section-title">Building</div>
                <input id="locBuilding" type="text">

                <div class="section-title">Apartment (optional)</div>
                <input id="locApartment" type="text">

                <button onclick="createLocation()">Save Location</button>

                <div id="locationMessage"></div>
            </div>
        </div>

    </div>
</div>

<script>

    let currentUserId = null;

    function showRoles() {
        document.getElementById("homeState").classList.add("hidden");
        document.getElementById("metersPanel").classList.add("hidden");
        document.getElementById("locationsPanel").classList.add("hidden");
        document.getElementById("rolesPanel").classList.remove("hidden");
    }

    function showMeters() {
        document.getElementById("homeState").classList.add("hidden");
        document.getElementById("rolesPanel").classList.add("hidden");
        document.getElementById("locationsPanel").classList.add("hidden");
        document.getElementById("metersPanel").classList.remove("hidden");
        loadMeterTypes();
    }

    function showLocations() {
        document.getElementById("homeState").classList.add("hidden");
        document.getElementById("rolesPanel").classList.add("hidden");
        document.getElementById("metersPanel").classList.add("hidden");
        document.getElementById("locationsPanel").classList.remove("hidden");
    }

    /* =========================
       ROLE SEARCH (UNCHANGED)
    ========================= */

    async function searchUser() {
        const value = document.getElementById("searchInput").value;
        const errorBox = document.getElementById("errorBox");

        errorBox.innerText = "";

        const res = await fetch(`/national-energy-platform/api/users/search?value=${value}`);

        if (!res.ok) {
            errorBox.innerText = "User not found";
            document.getElementById("userBox").classList.add("hidden");
            return;
        }

        const data = await res.json();

        currentUserId = data.userId;

        document.getElementById("userBox").classList.remove("hidden");
        document.getElementById("userName").innerText = data.fullName;

        const assignedDiv = document.getElementById("assignedRoles");
        assignedDiv.innerHTML = "";

        data.assignedRoles.forEach(role => {
            const span = document.createElement("span");
            span.className = "role";
            span.innerHTML = `${role.name} <span class="remove-role" onclick="removeRole(${role.id})">x</span>`;
            assignedDiv.appendChild(span);
        });
    }

    /* =========================
       LOCATION USER SEARCH (NEW)
    ========================= */

    async function selectUserForLocation() {
        const value = document.getElementById("locUserSearch").value;

        const res = await fetch(`/national-energy-platform/api/users/search?value=${value}`);

        const msg = document.getElementById("selectedUserInfo");

        if (!res.ok) {
            msg.innerText = "User not found";
            currentUserId = null;
            return;
        }

        const data = await res.json();

        currentUserId = data.userId;

        msg.innerText = `Selected: ${data.fullName} (ID: ${data.userId})`;
    }

    /* =========================
       LOCATION SAVE
    ========================= */

    async function createLocation() {

        const city = document.getElementById("locCity").value.trim();
        const street = document.getElementById("locStreet").value.trim();
        const building = document.getElementById("locBuilding").value.trim();
        const apartment = document.getElementById("locApartment").value.trim();

        const msg = document.getElementById("locationMessage");
        msg.innerText = "";

        if (!currentUserId) {
            msg.innerText = "Select a user first";
            return;
        }

        const res = await fetch(`/national-energy-platform/api/locations/${currentUserId}`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                city,
                street,
                buildingNumber: building,
                apartmentNumber: apartment || null
            })
        });

        msg.innerText = res.ok ? "Location saved successfully" : await res.text();
    }

</script>

</body>
</html>
