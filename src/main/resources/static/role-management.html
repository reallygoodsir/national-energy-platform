<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Role Management</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            background: #0f172a;
            color: white;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* LEFT PANEL */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            background: #0b1220;
        }

        /* RIGHT PANEL */
        .right-panel {
            width: 420px;
            background: #111827;
            display: flex;
            flex-direction: column;
            padding: 40px;
            overflow-y: auto;
        }

        h2 {
            margin-bottom: 20px;
        }

        input, select {
            margin: 8px 0;
            padding: 10px;
            border: none;
            border-radius: 4px;
            width: 100%;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            background: #3b82f6;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #2563eb;
        }

        .box {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #1f2937;
            border-radius: 6px;
            background: #0b1220;
        }

        .roles {
            margin-top: 10px;
        }

        .role {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #1f2937;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 5px;
            font-size: 12px;
        }

        .remove-role {
            cursor: pointer;
            color: #f87171;
            font-weight: bold;
        }

        .error {
            color: #f87171;
            margin-top: 10px;
        }

        .success {
            color: #34d399;
            margin-top: 10px;
        }

        .muted {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 5px;
        }

        .hidden {
            display: none;
        }

        .section-title {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #cbd5e1;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT PANEL -->
    <div class="left-panel">
        <h1>Role Management</h1>
        <p>Assign and manage user roles</p>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">

        <h2>User Search</h2>

        <input type="text" id="searchInput" placeholder="Enter email or phone">
        <button onclick="searchUser()">Search User</button>

        <div id="errorBox" class="error"></div>

        <!-- USER BOX -->
        <div id="userBox" class="box hidden">

            <h3 id="userName"></h3>

            <div class="section-title">Assigned Roles</div>
            <div id="assignedRoles" class="roles"></div>

            <div class="section-title">Assign New Role</div>

            <select id="roleSelect"></select>

            <div id="noRolesMsg" class="muted hidden">
                No available roles
            </div>

            <button onclick="assignRole()">Assign Role</button>

            <div id="assignMessage"></div>
        </div>

    </div>
</div>

<script>

    let currentUserId = null;

    /* ---------------- SEARCH USER ---------------- */
    async function searchUser() {

        const value = document.getElementById("searchInput").value;

        document.getElementById("errorBox").innerText = "";
        document.getElementById("assignMessage").innerText = "";

        const res = await fetch(`/api/users/search?value=${value}`);

        if (!res.ok) {
            document.getElementById("userBox").classList.add("hidden");
            document.getElementById("errorBox").innerText = "User not found";
            return;
        }

        const data = await res.json();

        currentUserId = data.userId;

        document.getElementById("userBox").classList.remove("hidden");
        document.getElementById("userName").innerText = data.fullName;

        /* ---------------- ASSIGNED ROLES ---------------- */
        const assignedDiv = document.getElementById("assignedRoles");
        assignedDiv.innerHTML = "";

        data.assignedRoles.forEach(role => {

            const span = document.createElement("span");
            span.className = "role";

            span.innerHTML = `
                ${role.name}
                <span class="remove-role" onclick="removeRole(${role.id})">x</span>
            `;

            assignedDiv.appendChild(span);
        });

        /* ---------------- AVAILABLE ROLES ---------------- */
        const select = document.getElementById("roleSelect");
        const noRolesMsg = document.getElementById("noRolesMsg");

        select.innerHTML = "";

        if (!data.availableRoles || data.availableRoles.length === 0) {

            select.classList.add("hidden");
            noRolesMsg.classList.remove("hidden");

        } else {

            select.classList.remove("hidden");
            noRolesMsg.classList.add("hidden");

            data.availableRoles.forEach(role => {
                const option = document.createElement("option");
                option.value = role.id;
                option.text = role.name;
                select.appendChild(option);
            });
        }
    }

    /* ---------------- ASSIGN ROLE ---------------- */
    async function assignRole() {

        const select = document.getElementById("roleSelect");

        if (select.classList.contains("hidden")) return;

        const roleId = select.value;

        const res = await fetch("/api/users/role", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                userId: currentUserId,
                roleId: Number(roleId)
            })
        });

        const msgBox = document.getElementById("assignMessage");

        if (!res.ok) {
            msgBox.className = "error";
            msgBox.innerText = "Failed to assign role";
            return;
        }

        msgBox.className = "success";
        msgBox.innerText = "Role assigned successfully";

        searchUser();
    }

    /* ---------------- REMOVE ROLE ---------------- */
    async function removeRole(roleId) {

        const res = await fetch("/api/users/role", {
            method: "DELETE",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                userId: currentUserId,
                roleId: roleId
            })
        });

        const msgBox = document.getElementById("assignMessage");

        if (!res.ok) {
            msgBox.className = "error";
            msgBox.innerText = "Failed to remove role";
            return;
        }

        msgBox.className = "success";
        msgBox.innerText = "Role removed successfully";

        searchUser();
    }

</script>

</body>
</html>
